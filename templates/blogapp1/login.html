
{%extends 'base.html' %}
{%block main %}
<style>
    .login-box {
            background-color: #fff;
            width: 350px;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-left: 35vw;
            position: fixed;
            top: 20vh;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
        }
    button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }
        p {
            text-align: center;
            margin-top: 15px;
        }

        a {
            color: #007bff;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    
</style>
 <div class="login-box">
        <h2>Login</h2>

        <form action="" method="post">
            {% csrf_token %}
            <label for="nme">Username</label>
            <input type="text" name="nme" id="nme" placeholder="Enter your username" required>

            <label for="pwd">Password</label>
            <input type="password" name="pwd" id="pwd" placeholder="Enter your password" required>

            <button type="submit">Login</button>

            <p>Don't have an account? 
                <a href="{% url 'registerurl' %}">Register</a>
            </p>
        </form>
    </div>

    {%endblock %}
