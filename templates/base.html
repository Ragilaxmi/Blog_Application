{%load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/Main.css' %}">
    <style>
      .navbar{
        position: fixed;
        width:100vw;
      }
      
    </style>
</head>

<body>
 <nav class="navbar navbar-expand-lg bg-body-tertiary fixed-top" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">StudentBlog</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="{%url 'homeurl' %}">Home</a>
        </li>
          <li class="nav-item">
          <a class="nav-link" href="#">Profile</a>
        </li>
        
        <li class="nav-item">
          {%if request.user.is_authenticated %}
          <li class="nav-item">
          <a class="nav-link" href="{%url 'inserturl' %}">Add Blogs</a>
        </li>
          <a class="nav-link" href="{%url 'logouturl' %}">Logout</a>
          
          {% else %}
        <li class="nav-item">
        <a class="nav-link" href="{% url 'loginurl' %}">Login</a>
        </li>
        <li class="nav-item">
         <a class="nav-link" href="{% url 'registerurl' %}">Register</a>
        </li>
          {%endif %}
        </li>
        </li>
      </ul>
      <form class="d-flex" role="search" action="{% url 'searchurl' %}" method="post">
        {%csrf_token%}
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" id="search" name="search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<div class="container mt-5 pt-5">
{%block main %}
{%endblock %}
</div>

</body>
</html>
